spring:
  application:
    name: production-analytics

  datasource:
    url: jdbc:h2:mem:prod_events_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true